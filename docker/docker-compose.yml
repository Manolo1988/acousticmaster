services:
  # Node.js 应用服务（可横向扩展多个实例）
  acoustic-api:
    container_name: acoustic-api
    restart: always
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGINS=http://115.231.236.153:8100
      - DIFY_API_KEY=app-NB3lEaGg14fyON5fYhENY1oV
      - DIFY_CHAT_API_URL=${DIFY_CHAT_API_URL:-http://115.231.236.153:20000/v1/chat-messages}
    ports:
      - "3001"
    networks:
      - backend

  ai-daemon:
    container_name: ai-daemon
    restart: always
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    command: ["node", "daemon_v2.cjs"]
    environment:
      - NODE_ENV=production
      - DOCKER_COMPOSE_MANAGED=true
      - PROJECT_ROOT=/app
      - AI_BACKEND_PORT=3003
      - AI_DAEMON_PORT=4000
      - LOCAL_LLM_MODEL=qwen3:32b
      - LOCAL_LLM_URL=http://host.docker.internal:11434/v1/chat/completions
      - OLLAMA_KEEP_ALIVE=-1
      - CORS_ORIGINS=http://115.231.236.153:8100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3003"
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const s=net.createConnection({host:'127.0.0.1',port:3003},()=>{s.end();process.exit(0);});s.on('error',()=>process.exit(1));setTimeout(()=>{process.exit(1);},5000);\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - backend

  acoustic-nginx:
    container_name: acoustic-nginx
    image: nginx:1.19-alpine
    restart: always
    volumes:
      - ./log/nginx:/var/log/nginx
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
    ports:
      - "8100:80"
    depends_on:
      - acoustic-api
      - ai-daemon
    networks:
      - backend

networks:
  backend:
    driver: bridge
