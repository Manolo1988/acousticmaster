services:
  # Node.js 应用服务（可横向扩展多个实例）
  acoustic-api:
    container_name: acoustic-api
    restart: always
    build: 
      context: ../backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGINS=http://115.231.236.153:8100
    ports:
      - "3001"
    networks:
      - backend

  acoustic-nginx:
    container_name: acoustic-nginx
    image: nginx:1.19-alpine
    restart: always
    volumes:
      - ./log/nginx:/var/log/nginx
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
    ports:
      - "8100:80"
    depends_on:
      - acoustic-api
    networks:
      - backend

networks:
  backend:
    driver: bridge